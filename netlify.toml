[build]
  command = "node scripts/build-blog.js && node scripts/post-build.js && node scripts/enhance.js && node scripts/update-target.js && node scripts/finalize-site.js && node scripts/native-accordions.js && node scripts/refine-blog.js && node scripts/newsletter-prep.js && node scripts/finishing-touches.js && node scripts/diversity-art.js && node scripts/home-news.js"
  publish = "dist"
  ignore = '[ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ":(exclude)content/messages"'

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
