# Mecenia — configuration Netlify
# Le site est généré en une seule commande : contenu (content/) + gabarits (build/) + styles et scripts (src/) → dist/.
[build]
  command = "node build/build.js"
  publish = "dist"
  # Aucune reconstruction quand seuls des messages de formulaire sont enregistrés (content/messages).
  ignore = '[ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ":(exclude)content/messages"'

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
