[build]
  command = "node scripts/build-blog.js && node scripts/post-build.js"
  publish = "dist"
  ignore = '[ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ":(exclude)content/messages"'

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
