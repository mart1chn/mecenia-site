<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-label="Accès à la culture : 77 % à Paris, 60 % en moyenne, 42 % dans les communes rurales"><style>.s{font-family:Inter,Arial,sans-serif}.h{font-family:"Playfair Display",Georgia,serif;font-weight:700}</style><rect width="1200" height="410" fill="#FFFFFF"/><text x="60" y="52" class="h" font-size="26" fill="#2E2114">Accès à la culture : un fossé entre Paris et les territoires ruraux</text><text x="60" y="78" class="s" font-size="14" fill="#8C6239">Part des Français se déclarant satisfaits de leur accès à la culture, en %</text><text x="60" y="152" class="s" font-size="16" fill="#2E2114">Paris</text><rect x="300" y="120" width="539" height="48" fill="#2E2114"/><text x="853" y="152" class="s" font-size="22" fill="#2E2114" font-weight="700">77 %</text><text x="60" y="232" class="s" font-size="16" fill="#2E2114">Ensemble des Français</text><rect x="300" y="200" width="420" height="48" fill="#B5754A"/><text x="734" y="232" class="s" font-size="22" fill="#2E2114" font-weight="700">60 %</text><text x="60" y="312" class="s" font-size="16" fill="#2E2114">Communes rurales</text><rect x="300" y="280" width="294" height="48" fill="#8C6239"/><text x="608" y="312" class="s" font-size="22" fill="#2E2114" font-weight="700">42 %</text><text x="60" y="390" class="s" font-size="12" fill="#8C6239">Source : sondage Acteurs publics / EY réalisé par l'Ifop pour l'Observatoire des politiques publiques.</text></svg>