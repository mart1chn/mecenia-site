<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Mecenia — La culture en France : trois repères</title><desc id="d">2024 : 54,1 milliards de valeur ajoutée ; 2,1 % de la valeur ajoutée de l’économie ; 113,8 milliards de production. Indicateurs non additionnables.</desc><rect width="1200" height="800" fill="#F5EFE6"/><path d="M55 50H1145" stroke="#B5754A" stroke-width="4"/><g font-family="Georgia,serif" fill="#2E2114"><text x="55" y="108" font-size="32" fill="#8C6239">MECENIA</text><text x="55" y="175" font-size="40">La culture en France : trois repères</text></g><g fill="white"><rect x="55" y="235" width="350" height="270" rx="10"/><rect x="425" y="235" width="350" height="270" rx="10"/><rect x="795" y="235" width="350" height="270" rx="10"/></g><g font-family="Georgia,serif" font-size="51" fill="#8C6239"><text x="79" y="335">54,1 Md€</text><text x="449" y="335">2,1 %</text><text x="819" y="335">113,8 Md€</text></g><g font-family="Arial,sans-serif" fill="#2E2114" font-size="21"><text x="79" y="403">Valeur ajoutée culturelle</text><text x="79" y="439">Richesse directement créée</text><text x="449" y="403">Part de la valeur ajoutée</text><text x="449" y="439">dans celle de l’économie</text><text x="819" y="403">Production culturelle totale</text><text x="819" y="439">Avant consommations</text><text x="819" y="475">intermédiaires</text><text x="55" y="570" font-size="25">Données 2024, provisoires. Ni chiffre d’affaires, ni budget du ministère.</text><text x="55" y="615" font-size="22" fill="#6B6055">Le taux de 2,1 % porte sur les valeurs ajoutées aux prix de base, pas exactement sur le PIB.</text><text x="55" y="694" fill="#8C6239">SOURCE : DEPS / INSEE · CC-2026-3 · PUBLICATION DU 4 SEPTEMBRE 2026</text><text x="55" y="737" fill="#8C6239">Source et méthodologie : ministère de la Culture · lien dans l’article</text></g></svg>