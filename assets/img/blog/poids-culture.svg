<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Poids de la culture : 2,0 % en 2022 et 2023, 2,1 % en 2024, objectif de 5 % en 2040"><style>.s{font-family:Inter,Arial,sans-serif}.h{font-family:"Playfair Display",Georgia,serif;font-weight:700}</style><rect width="1200" height="460" fill="#FFFFFF"/><text x="60" y="52" class="h" font-size="26" fill="#2E2114">Le poids direct de la culture dans l'économie</text><text x="60" y="78" class="s" font-size="14" fill="#8C6239">Part de la valeur ajoutée des branches culturelles, en %</text><rect x="130" y="276" width="130" height="104" fill="#8C6239"/><text x="195" y="266" class="s" font-size="20" fill="#2E2114" text-anchor="middle" font-weight="700">2,0 %</text><text x="195" y="408" class="s" font-size="15" fill="#2E2114" text-anchor="middle">2022</text><rect x="380" y="276" width="130" height="104" fill="#8C6239"/><text x="445" y="266" class="s" font-size="20" fill="#2E2114" text-anchor="middle" font-weight="700">2,0 %</text><text x="445" y="408" class="s" font-size="15" fill="#2E2114" text-anchor="middle">2023</text><rect x="630" y="271" width="130" height="109" fill="#B5754A"/><text x="695" y="261" class="s" font-size="20" fill="#2E2114" text-anchor="middle" font-weight="700">2,1 %</text><text x="695" y="408" class="s" font-size="15" fill="#2E2114" text-anchor="middle">2024</text><rect x="880" y="120" width="130" height="260" fill="#2E2114"/><text x="945" y="110" class="s" font-size="20" fill="#2E2114" text-anchor="middle" font-weight="700">5 %</text><text x="945" y="408" class="s" font-size="15" fill="#2E2114" text-anchor="middle">Ambition 2040</text><path d="M100 380H1140" stroke="#2E2114"/><text x="60" y="440" class="s" font-size="12" fill="#8C6239">Source : DEPS, ministère de la Culture. La barre 2040 est l'objectif de Mecenia, pas une prévision.</text></svg>