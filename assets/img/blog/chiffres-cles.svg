<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Chiffres clés : 54,1 Md€ de valeur ajoutée, 2,1 % de l'économie, ambition de 5 % en 2040"><style>.s{font-family:Inter,Arial,sans-serif}.h{font-family:"Playfair Display",Georgia,serif;font-weight:700}</style><rect width="1200" height="280" fill="#F5EFE6"/><text x="600" y="62" class="s" font-size="15" fill="#B5754A" text-anchor="middle" letter-spacing="3">LA CULTURE EN FRANCE EN CHIFFRES</text><text x="200" y="160" class="h" font-size="54" fill="#2E2114" text-anchor="middle">54,1 Md€</text><text x="200" y="200" class="s" font-size="15" fill="#8C6239" text-anchor="middle">de valeur ajoutée des branches</text><text x="200" y="222" class="s" font-size="15" fill="#8C6239" text-anchor="middle">culturelles (2024)</text><path d="M400 110v130" stroke="#B5754A" opacity=".4"/><text x="600" y="160" class="h" font-size="54" fill="#2E2114" text-anchor="middle">2,1 %</text><text x="600" y="200" class="s" font-size="15" fill="#8C6239" text-anchor="middle">poids direct de la culture dans</text><text x="600" y="222" class="s" font-size="15" fill="#8C6239" text-anchor="middle">l'économie (2024)</text><path d="M800 110v130" stroke="#B5754A" opacity=".4"/><text x="1000" y="160" class="h" font-size="54" fill="#B5754A" text-anchor="middle">5 %</text><text x="1000" y="200" class="s" font-size="15" fill="#8C6239" text-anchor="middle">notre ambition pour la culture</text><text x="1000" y="222" class="s" font-size="15" fill="#8C6239" text-anchor="middle">dans le PIB d'ici 2040</text></svg>