<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="t d"><title id="t">Mecenia — Mécénat et sponsoring : deux logiques</title><desc id="d">Mécénat : intention libérale, contreparties très inférieures au don, réduction fiscale sous conditions. Sponsoring : prestation commerciale, déduction du résultat sous conditions, facture.</desc><rect width="1200" height="1050" fill="#F5EFE6"/><path d="M55 50H1145" stroke="#B5754A" stroke-width="4"/><g font-family="Georgia,serif" fill="#2E2114"><text x="55" y="108" font-size="32" fill="#8C6239">MECENIA</text><text x="55" y="175" font-size="40">Mécénat et sponsoring : deux logiques</text></g><rect x="55" y="245" width="520" height="635" rx="12" fill="#FFFFFF"/><rect x="625" y="245" width="520" height="635" rx="12" fill="#2E2114"/><g font-family="Arial,sans-serif"><g fill="#8C6239" font-size="26"><text x="83" y="300" font-size="30">MÉCÉNAT</text><text x="83" y="351">Finalité</text><text x="83" y="487">Contreparties</text><text x="83" y="623">Fiscalité</text><text x="83" y="759">Justificatif</text></g><g fill="#2E2114" font-size="23"><text x="83" y="385">Soutenir une activité d’intérêt</text><text x="83" y="415">général par une intention libérale.</text><text x="83" y="521">Très inférieures au don. La simple</text><text x="83" y="551">mention du nom peut être admise.</text><text x="83" y="657">Réduction d’impôt sous conditions.</text><text x="83" y="687">Le don n’est pas fiscalement</text><text x="83" y="717">déductible.</text><text x="83" y="793">Reçu fiscal et pièces justificatives</text><text x="83" y="823">pour bénéficier du régime.</text></g><g fill="#D9A67F" font-size="26"><text x="653" y="300" font-size="30">SPONSORING</text><text x="653" y="351">Finalité</text><text x="653" y="487">Contreparties</text><text x="653" y="623">Fiscalité</text><text x="653" y="759">Justificatif</text></g><g fill="#FAF7F2" font-size="23"><text x="653" y="385">Acheter une prestation de visibilité</text><text x="653" y="415">ou de promotion commerciale.</text><text x="653" y="521">Bénéfice direct attendu. La prestation</text><text x="653" y="551">rémunérée est déterminante.</text><text x="653" y="657">Charge déductible sous conditions.</text><text x="653" y="687">Pas de réduction mécénat sur</text><text x="653" y="717">ce paiement.</text><text x="653" y="793">Facture. TVA à examiner selon le</text><text x="653" y="823">régime applicable au prestataire.</text></g><text x="55" y="941" font-size="25" fill="#2E2114">La réalité de l’opération prime sur le titre de la convention.</text><text x="55" y="993" font-size="20" fill="#8C6239">SOURCES : CGI, ART. 238 BIS ET 39, 1, 7° · BOFiP, § 120–180 · 7 OCTOBRE 2026</text></g></svg>