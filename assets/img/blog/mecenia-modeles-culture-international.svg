<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1430" viewBox="0 0 1000 1430" role="img" aria-labelledby="t d"><title id="t">Mecenia — France, Suisse, États-Unis : trois approches du soutien culturel</title><desc id="d">France : réduction d’impôt, BNP Paribas et LVMH. Suisse : déduction du bénéfice, UBS, Beyeler et Art Basel. États-Unis : déduction fédérale, financement public et privé, Bank of America et NEA. Les dispositifs ne sont pas interchangeables.</desc><rect width="1000" height="1430" fill="#F5EFE6"/><path d="M48 50H952" stroke="#B5754A" stroke-width="4"/><g font-family="Georgia,serif" fill="#2E2114"><text x="48" y="108" font-size="32" letter-spacing="5">MECENIA</text><text x="48" y="178" font-size="42">Trois approches du soutien culturel</text></g><text x="48" y="224" font-family="Arial,sans-serif" font-size="24" fill="#6B6055">France · Suisse · États-Unis</text><g font-family="Arial,sans-serif"><rect x="48" y="270" width="904" height="305" rx="12" fill="#FFFFFF"/><rect x="48" y="270" width="8" height="305" fill="#8C6239"/><text x="80" y="325" font-size="36" font-weight="700" fill="#2E2114">France</text><text x="80" y="377" font-size="27" fill="#8C6239">Réduction d’impôt pour les dons éligibles</text><text x="80" y="423" font-size="24" fill="#3D3226">Fondations d’entreprise · artistes · patrimoine</text><text x="80" y="459" font-size="24" fill="#3D3226">et institutions culturelles.</text><text x="80" y="512" font-size="24" fill="#6B6055">Acteurs étudiés : BNP Paribas et LVMH</text><text x="80" y="550" font-size="22" fill="#6B6055">Source : ministère de la Culture et organismes cités.</text><rect x="48" y="600" width="904" height="305" rx="12" fill="#FFFFFF"/><rect x="48" y="600" width="8" height="305" fill="#B5754A"/><text x="80" y="655" font-size="36" font-weight="700" fill="#2E2114">Suisse</text><text x="80" y="707" font-size="27" fill="#8C6239">Déduction du bénéfice imposable</text><text x="80" y="753" font-size="24" fill="#3D3226">Fondation culturelle · médiation artistique</text><text x="80" y="789" font-size="24" fill="#3D3226">et partenariats avec le marché de l’art.</text><text x="80" y="842" font-size="24" fill="#6B6055">Acteurs étudiés : UBS, Beyeler et Art Basel</text><text x="80" y="880" font-size="22" fill="#6B6055">Sources : LIFD, art. 59, et organismes cités.</text><rect x="48" y="930" width="904" height="305" rx="12" fill="#2E2114"/><text x="80" y="985" font-size="36" font-weight="700" fill="#FAF7F2">États-Unis</text><text x="80" y="1037" font-size="27" fill="#D9A67F">Déduction fédérale des contributions éligibles</text><text x="80" y="1083" font-size="24" fill="#FAF7F2">Entreprises · particuliers · fondations</text><text x="80" y="1119" font-size="24" fill="#FAF7F2">et acteurs publics.</text><text x="80" y="1172" font-size="24" fill="#D8CFC0">Acteurs étudiés : Bank of America et NEA</text><text x="80" y="1210" font-size="22" fill="#D8CFC0">Sources : IRC, section 170, NEA et Bank of America.</text><text x="48" y="1282" font-size="23" fill="#3D3226">Réduction ≠ déduction. Conditions et plafonds à vérifier.</text><text x="48" y="1322" font-size="21" fill="#6B6055">Suisse : distinguer impôt fédéral et règles cantonales.</text><text x="48" y="1385" font-size="20" fill="#8C6239">INFOGRAPHIE MECENIA · OCTOBRE 2026 · SOURCES ET NUANCES DANS L’ARTICLE</text></g></svg>