<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="t d"><title id="t">Mecenia — Budget 2027 : des évolutions contrastées</title><desc id="d">Variations de crédits de paiement rapportées par Beaux Arts : monuments −8,38 %, éducation artistique −8,1 %, spectacle vivant −4,92 %, transmission −3,92 %, création −3,5 %, arts visuels +2,18 %, musées +3,92 %. Lignes non additionnables, projet non adopté.</desc><rect width="1200" height="1080" fill="#F5EFE6"/><path d="M55 50H1145" stroke="#B5754A" stroke-width="4"/><g font-family="Georgia,serif" fill="#2E2114"><text x="55" y="108" font-size="32" fill="#8C6239">MECENIA</text><text x="55" y="175" font-size="40">Budget 2027 : des évolutions contrastées</text></g><g font-family="Arial,sans-serif" font-size="22" fill="#2E2114"><text x="55" y="223" font-size="23" fill="#6B6055">Projet non adopté · variations rapportées par Beaux Arts, 5–6 octobre 2026</text><text x="55" y="307">Monuments historiques et patrimoine</text><text x="55" y="333">monumental</text><text x="55" y="391">Éducation artistique et culturelle</text><text x="55" y="475">Spectacle vivant</text><text x="55" y="559">Transmission et démocratisation</text><text x="55" y="643">Programme Création</text><text x="55" y="727">Arts visuels</text><text x="55" y="811">Musées</text><text x="1065" y="312">−8,38 %</text><text x="1065" y="396">−8,10 %</text><text x="1065" y="480">−4,92 %</text><text x="1065" y="564">−3,92 %</text><text x="1065" y="648">−3,50 %</text><text x="1065" y="732">+2,18 %</text><text x="1065" y="816">+3,92 %</text></g><g stroke="#6B6055"><path d="M930 280V329M930 364V413M930 448V497M930 532V581M930 616V665M930 700V749M930 784V833"/></g><g fill="#8C6239"><rect x="640.89" y="288" width="289.11" height="30" rx="3"/><rect x="650.55" y="372" width="279.45" height="30" rx="3"/><rect x="760.26" y="456" width="169.74" height="30" rx="3"/><rect x="794.76" y="540" width="135.24" height="30" rx="3"/><rect x="809.25" y="624" width="120.75" height="30" rx="3"/></g><g fill="#B5754A"><rect x="930" y="708" width="75.21" height="30" rx="3"/><rect x="930" y="792" width="135.24" height="30" rx="3"/></g><g font-family="Arial,sans-serif"><text x="55" y="915" font-size="23" fill="#2E2114">Programmes et actions se recoupent : ne pas additionner ces variations.</text><text x="55" y="955" font-size="22" fill="#6B6055">Pas de projection d’emplois perdus ni de conséquences économiques chiffrées.</text><text x="55" y="1022" font-size="20" fill="#8C6239">SOURCE : BEAUX ARTS · PLF 2027 · CHIFFRES DE PRESSE, NON BUDGET DÉFINITIF</text></g></svg>