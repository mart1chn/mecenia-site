<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Les quatre missions de Mecenia : rencontre, vision, propositions, publications"><style>.s{font-family:Inter,Arial,sans-serif}.h{font-family:"Playfair Display",Georgia,serif;font-weight:700}</style><rect width="900" height="400" fill="#F5EFE6"/><text x="450" y="46" class="h" font-size="26" fill="#2E2114" text-anchor="middle">Nos quatre missions</text><rect x="30" y="80" width="410" height="135" fill="#fff" stroke="#B5754A"/><circle cx="80" cy="147" r="26" fill="#2E2114"/><text x="80" y="157" class="h" font-size="28" fill="#F5EFE6" text-anchor="middle">1</text><text x="124" y="138" class="h" font-size="20" fill="#2E2114">Favoriser la rencontre</text><text x="124" y="168" class="s" font-size="14" fill="#8C6239">entre acteurs économiques et acteurs</text><text x="124" y="188" class="s" font-size="14" fill="#8C6239">de la culture</text><rect x="460" y="80" width="410" height="135" fill="#fff" stroke="#B5754A"/><circle cx="510" cy="147" r="26" fill="#2E2114"/><text x="510" y="157" class="h" font-size="28" fill="#F5EFE6" text-anchor="middle">2</text><text x="554" y="138" class="h" font-size="20" fill="#2E2114">Faire émerger une vision</text><text x="554" y="168" class="s" font-size="14" fill="#8C6239">de la culture comme opportunité</text><text x="554" y="188" class="s" font-size="14" fill="#8C6239">économique</text><rect x="30" y="235" width="410" height="135" fill="#fff" stroke="#B5754A"/><circle cx="80" cy="302" r="26" fill="#2E2114"/><text x="80" y="312" class="h" font-size="28" fill="#F5EFE6" text-anchor="middle">3</text><text x="124" y="293" class="h" font-size="20" fill="#2E2114">Porter des propositions</text><text x="124" y="323" class="s" font-size="14" fill="#8C6239">pragmatiques dans le champ des</text><text x="124" y="343" class="s" font-size="14" fill="#8C6239">affaires publiques</text><rect x="460" y="235" width="410" height="135" fill="#fff" stroke="#B5754A"/><circle cx="510" cy="302" r="26" fill="#2E2114"/><text x="510" y="312" class="h" font-size="28" fill="#F5EFE6" text-anchor="middle">4</text><text x="554" y="293" class="h" font-size="20" fill="#2E2114">Organiser et publier</text><text x="554" y="323" class="s" font-size="14" fill="#8C6239">événements, colloques, études et</text><text x="554" y="343" class="s" font-size="14" fill="#8C6239">tribunes</text></svg>