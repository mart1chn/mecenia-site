<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" role="img" aria-label="Les quatre missions de Mecenia : rencontre, vision, propositions, publications"><style>.s{font-family:Inter,Arial,sans-serif}.h{font-family:"Playfair Display",Georgia,serif;font-weight:700}</style><rect width="600" height="710" fill="#FFFFFF"/><text x="300" y="56" class="h" font-size="26" fill="#2E2114" text-anchor="middle">Nos quatre missions</text><rect x="30" y="100" width="540" height="124" fill="#fff" stroke="#B5754A" opacity=".9"/><circle cx="90" cy="162" r="30" fill="#2E2114"/><text x="90" y="174" class="h" font-size="32" fill="#F5EFE6" text-anchor="middle">1</text><text x="140" y="150" class="h" font-size="22" fill="#2E2114">Favoriser la rencontre</text><text x="140" y="180" class="s" font-size="14" fill="#8C6239">entre acteurs économiques et acteurs de</text><text x="140" y="200" class="s" font-size="14" fill="#8C6239">la culture</text><rect x="30" y="250" width="540" height="124" fill="#fff" stroke="#B5754A" opacity=".9"/><circle cx="90" cy="312" r="30" fill="#2E2114"/><text x="90" y="324" class="h" font-size="32" fill="#F5EFE6" text-anchor="middle">2</text><text x="140" y="300" class="h" font-size="22" fill="#2E2114">Faire émerger une vision</text><text x="140" y="330" class="s" font-size="14" fill="#8C6239">de la culture comme opportunité</text><text x="140" y="350" class="s" font-size="14" fill="#8C6239">économique</text><rect x="30" y="400" width="540" height="124" fill="#fff" stroke="#B5754A" opacity=".9"/><circle cx="90" cy="462" r="30" fill="#2E2114"/><text x="90" y="474" class="h" font-size="32" fill="#F5EFE6" text-anchor="middle">3</text><text x="140" y="450" class="h" font-size="22" fill="#2E2114">Porter des propositions</text><text x="140" y="480" class="s" font-size="14" fill="#8C6239">pragmatiques dans le champ des affaires</text><text x="140" y="500" class="s" font-size="14" fill="#8C6239">publiques</text><rect x="30" y="550" width="540" height="124" fill="#fff" stroke="#B5754A" opacity=".9"/><circle cx="90" cy="612" r="30" fill="#2E2114"/><text x="90" y="624" class="h" font-size="32" fill="#F5EFE6" text-anchor="middle">4</text><text x="140" y="600" class="h" font-size="22" fill="#2E2114">Organiser et publier</text><text x="140" y="630" class="s" font-size="14" fill="#8C6239">événements, colloques, études et</text><text x="140" y="650" class="s" font-size="14" fill="#8C6239">tribunes</text></svg>