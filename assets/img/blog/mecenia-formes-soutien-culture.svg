<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="t d"><title id="t">Mecenia — Les quatre formes de soutien culturel</title><desc id="d">Mécénat financier : don pour une œuvre. En nature : apport de matériel. De compétences : mobilisation de savoir-faire. Parrainage : prestation de visibilité publicitaire.</desc><rect width="1000" height="1220" fill="#F5EFE6"/><path d="M48 50H952" stroke="#B5754A" stroke-width="4"/><g font-family="Georgia,serif" fill="#2E2114"><text x="48" y="108" font-size="32" letter-spacing="5">MECENIA</text><text x="48" y="178" font-size="42">Quatre façons de soutenir la culture</text></g><text x="48" y="222" font-family="Arial,sans-serif" font-size="24" fill="#6B6055">Comprendre les apports, distinguer les logiques.</text><g font-family="Arial,sans-serif"><rect x="48" y="267" width="904" height="180" rx="12" fill="#FFFFFF"/><rect x="48" y="267" width="8" height="180" fill="#8C6239"/><text x="78" y="312" font-size="24" fill="#8C6239">01 · DON FINANCIER</text><text x="78" y="355" font-size="32" font-weight="700" fill="#2E2114">Mécénat financier</text><text x="78" y="398" font-size="25" fill="#3D3226">Contribuer à une action d’intérêt général.</text><text x="78" y="429" font-size="24" fill="#6B6055">Exemple : donner pour restaurer une œuvre.</text><rect x="48" y="467" width="904" height="180" rx="12" fill="#FFFFFF"/><rect x="48" y="467" width="8" height="180" fill="#B5754A"/><text x="78" y="512" font-size="24" fill="#8C6239">02 · BIENS ET MOYENS</text><text x="78" y="555" font-size="32" font-weight="700" fill="#2E2114">Mécénat en nature</text><text x="78" y="598" font-size="25" fill="#3D3226">Apporter des biens ou des moyens.</text><text x="78" y="629" font-size="24" fill="#6B6055">Exemple : fournir du matériel à un organisme éligible.</text><rect x="48" y="667" width="904" height="180" rx="12" fill="#FFFFFF"/><rect x="48" y="667" width="8" height="180" fill="#8C6239"/><text x="78" y="712" font-size="24" fill="#8C6239">03 · SAVOIR-FAIRE</text><text x="78" y="755" font-size="32" font-weight="700" fill="#2E2114">Mécénat de compétences</text><text x="78" y="798" font-size="25" fill="#3D3226">Mobiliser des compétences professionnelles.</text><text x="78" y="829" font-size="24" fill="#6B6055">Exemple : accompagner un projet culturel.</text><rect x="48" y="867" width="904" height="180" rx="12" fill="#2E2114"/><text x="78" y="912" font-size="24" fill="#D9A67F">04 · VISIBILITÉ COMMERCIALE</text><text x="78" y="955" font-size="32" font-weight="700" fill="#FAF7F2">Parrainage / sponsoring</text><text x="78" y="998" font-size="25" fill="#FAF7F2">Obtenir une prestation de visibilité ou de promotion.</text><text x="78" y="1029" font-size="24" fill="#D8CFC0">Exemple : acheter une présence publicitaire dans un festival.</text><text x="48" y="1094" font-size="23" fill="#3D3226">La qualification dépend de la réalité de l’opération.</text><text x="48" y="1130" font-size="21" fill="#6B6055">Mécénat : éligibilité et contreparties à vérifier.</text><text x="48" y="1180" font-size="20" fill="#8C6239">INFOGRAPHIE MECENIA · OCTOBRE 2026 · SOURCE : MINISTÈRE DE LA CULTURE</text></g></svg>