<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Le chantier de la cour du Sphinx : nouvelle verrière, façades restaurées, nouveau sol, parcours romain repensé ; calendrier de la souscription du 1er octobre 2026 à la réouverture prévue en 2029"><style>.s{font-family:Inter,Arial,sans-serif}.h{font-family:"Playfair Display",Georgia,serif;font-weight:700}</style><rect width="1200" height="640" fill="#FFFFFF"/><text x="60" y="56" class="h" font-size="28" fill="#2E2114">Cour du Sphinx : le chantier en bref</text><text x="60" y="84" class="s" font-size="14" fill="#8C6239">Restauration portée par le musée du Louvre, sous la maîtrise d’œuvre de Michel Goutal, architecte en chef des monuments historiques</text><rect x="45" y="116" width="255" height="230" fill="#FFFFFF" stroke="#B5754A"/><circle cx="85" cy="156" r="22" fill="#2E2114"/><text x="85" y="165" class="h" font-size="24" fill="#F5EFE6" text-anchor="middle">1</text><text x="63" y="212" class="h" font-size="19" fill="#2E2114">Une nouvelle verrière</text><text x="63" y="242" class="s" font-size="14" fill="#8C6239">Elle remplace celle de 1934,</text><text x="63" y="262" class="s" font-size="14" fill="#8C6239">double la surface vitrée et</text><text x="63" y="282" class="s" font-size="14" fill="#8C6239">intègre une ventilation</text><text x="63" y="302" class="s" font-size="14" fill="#8C6239">naturelle (free-cooling).</text><rect x="330" y="116" width="255" height="230" fill="#FFFFFF" stroke="#B5754A"/><circle cx="370" cy="156" r="22" fill="#2E2114"/><text x="370" y="165" class="h" font-size="24" fill="#F5EFE6" text-anchor="middle">2</text><text x="348" y="212" class="h" font-size="19" fill="#2E2114">Des façades restaurées</text><text x="348" y="242" class="s" font-size="14" fill="#8C6239">Traitement des altérations</text><text x="348" y="262" class="s" font-size="14" fill="#8C6239">dues aux infiltrations d’eau,</text><text x="348" y="282" class="s" font-size="14" fill="#8C6239">dont les façades élevées</text><text x="348" y="302" class="s" font-size="14" fill="#8C6239">par Le Vau.</text><rect x="615" y="116" width="255" height="230" fill="#FFFFFF" stroke="#B5754A"/><circle cx="655" cy="156" r="22" fill="#2E2114"/><text x="655" y="165" class="h" font-size="24" fill="#F5EFE6" text-anchor="middle">3</text><text x="633" y="212" class="h" font-size="19" fill="#2E2114">Un nouveau sol</text><text x="633" y="242" class="s" font-size="14" fill="#8C6239">Réfection complète avec un</text><text x="633" y="262" class="s" font-size="14" fill="#8C6239">nouveau dallage intégrant</text><text x="633" y="282" class="s" font-size="14" fill="#8C6239">un plancher chauffant.</text><rect x="900" y="116" width="255" height="230" fill="#FFFFFF" stroke="#B5754A"/><circle cx="940" cy="156" r="22" fill="#2E2114"/><text x="940" y="165" class="h" font-size="24" fill="#F5EFE6" text-anchor="middle">4</text><text x="918" y="212" class="h" font-size="19" fill="#2E2114">Un parcours romain</text><text x="918" y="242" class="s" font-size="14" fill="#8C6239">Des œuvres monumentales de</text><text x="918" y="262" class="s" font-size="14" fill="#8C6239">tout l’empire romain, et de</text><text x="918" y="282" class="s" font-size="14" fill="#8C6239">nouveaux dispositifs de</text><text x="918" y="302" class="s" font-size="14" fill="#8C6239">médiation pour le public.</text><text x="60" y="404" class="s" font-size="13" fill="#B5754A" letter-spacing="3">CALENDRIER</text><path d="M120 470H1080" stroke="#2E2114" stroke-width="2"/><circle cx="120" cy="470" r="8" fill="#2E2114"/><circle cx="440" cy="470" r="8" fill="#B5754A"/><circle cx="760" cy="470" r="8" fill="#B5754A"/><circle cx="1080" cy="470" r="8" fill="#2E2114"/><text x="120" y="510" class="s" font-size="16" fill="#2E2114" text-anchor="middle" font-weight="700">1er octobre 2026</text><text x="120" y="532" class="s" font-size="13" fill="#8C6239" text-anchor="middle">Lancement de la souscription</text><text x="440" y="510" class="s" font-size="16" fill="#2E2114" text-anchor="middle" font-weight="700">23 novembre 2026</text><text x="440" y="532" class="s" font-size="13" fill="#8C6239" text-anchor="middle">Fin des propositions de nom</text><text x="760" y="510" class="s" font-size="16" fill="#2E2114" text-anchor="middle" font-weight="700">19 janvier 2027</text><text x="760" y="532" class="s" font-size="13" fill="#8C6239" text-anchor="middle">Fin de la souscription (800 000 €)</text><text x="1080" y="510" class="s" font-size="16" fill="#2E2114" text-anchor="middle" font-weight="700">2029</text><text x="1080" y="532" class="s" font-size="13" fill="#8C6239" text-anchor="middle">Réouverture prévue</text><text x="60" y="604" class="s" font-size="12" fill="#8C6239">Sources : musée du Louvre (tousmecenes.louvre.fr) et presse. Infographie : Mecenia.</text></svg>