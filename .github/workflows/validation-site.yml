name: Validation du site Mecenia
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Verifier la syntaxe JavaScript
        run: find build src netlify -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Executer le build integral configure dans Netlify
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const toml=fs.readFileSync('netlify.toml','utf8');
          const section=toml.split(/^\[build\]\s*$/m)[1];
          if(!section)throw Error('Section build absente');
          const line=section.split(/^\[/m)[0].match(/^\s*command\s*=\s*(".*")\s*$/m);
          if(!line)throw Error('Commande Netlify absente ou format non pris en charge');
          const command=JSON.parse(line[1]);
          console.log('Commande integrale : '+command);
          cp.execSync(command,{stdio:'inherit',env:{...process.env,CI:'true'}});
          for(const f of ['dist/index.html','dist/contact/index.html','dist/blog/index.html','dist/admin/index.html'])fs.accessSync(f);
          NODE
      - name: Verifier les liens, images locales, ancres et formulaires
        run: |
          mkdir -p validation-output
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import json
          root=Path('dist').resolve()
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.links=[]; self.labels=[]; self.forms=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='a' and a.get('href'): self.links.append(('link',a['href']))
                  if tag=='img' and a.get('src'): self.links.append(('image',a['src']))
                  if tag=='label' and a.get('for'): self.labels.append(a['for'])
                  if tag=='form': self.forms.append(a)
          pages={}
          for file in root.rglob('*.html'):
              if 'admin' in file.relative_to(root).parts: continue
              p=Page(); p.feed(file.read_text(encoding='utf-8')); pages[file.resolve()]=p
          issues=[]
          for file,p in pages.items():
              rel=str(file.relative_to(root))
              if len(p.ids)!=len(set(p.ids)): issues.append([rel,'duplicate_ids'])
              for label in p.labels:
                  if label not in p.ids: issues.append([rel,'label_without_input',label])
              for kind,href in p.links:
                  u=urlparse(href)
                  if u.scheme or u.netloc: continue
                  target=(root/unquote(u.path).lstrip('/') if u.path.startswith('/') else file.parent/unquote(u.path)) if u.path else file
                  if target.is_dir(): target=target/'index.html'
                  target=target.resolve()
                  if not target.is_relative_to(root) or not target.exists():
                      issues.append([rel,'missing_'+kind,href]); continue
                  if kind=='link' and u.fragment and target in pages and unquote(u.fragment) not in pages[target].ids:
                      issues.append([rel,'missing_anchor',href])
          names={f.get('name') for p in pages.values() for f in p.forms if f.get('data-netlify') is not None}
          for name in ['contact','adhesion']:
              if name not in names: issues.append(['forms','missing_netlify_form',name])
          report={'html_pages_checked':len(pages),'netlify_form_names':sorted(n for n in names if n),'issues':issues,'external_links_and_images':'not checked','form_submissions':'not performed'}
          Path('validation-output/html-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if issues: raise SystemExit(1)
          PY
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Verifier le site genere sur ordinateur et mobile
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),http=require('http'),assert=require('assert');
          const {chromium}=require('playwright');
          const root=path.resolve('dist');
          const mime={'.html':'text/html; charset=utf-8','.css':'text/css','.js':'application/javascript','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp'};
          const server=http.createServer((req,res)=>{
            let file;try{file=path.resolve(root,'.'+decodeURIComponent(new URL(req.url,'http://localhost').pathname));}catch(e){res.writeHead(400);res.end();return;}
            if(file!==root&&!file.startsWith(root+path.sep)){res.writeHead(403);res.end();return;}
            try{if(fs.statSync(file).isDirectory())file=path.join(file,'index.html');res.setHeader('Content-Type',mime[path.extname(file)]||'application/octet-stream');fs.createReadStream(file).on('error',()=>res.destroy()).pipe(res);}catch(e){res.writeHead(404);res.end();}
          });
          (async()=>{
            await new Promise(r=>server.listen(4173,'127.0.0.1',r));
            const browser=await chromium.launch();const report=[];
            try{
              for(const width of [320,390,768,980,981,1440]){
                const page=await browser.newPage({viewport:{width,height:900}});const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.route('**/*',r=>new URL(r.request().url()).hostname==='127.0.0.1'?r.continue():r.abort());
                await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
                assert(!(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth)),'Debordement horizontal '+width);
                const button=page.locator('.menu-toggle');
                if(width<=980&&await button.count()){
                  await button.click();assert.equal(await button.getAttribute('aria-expanded'),'true');
                  await page.keyboard.press('Escape');assert.equal(await button.getAttribute('aria-expanded'),'false');
                }
                for(const route of ['/blog/','/contact/'])await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'load'});
                if(fs.existsSync(path.join(root,'exposition/index.html')))await page.goto('http://127.0.0.1:4173/exposition/',{waitUntil:'load'});
                assert.deepEqual(errors,[],'Erreurs JavaScript '+width);
                report.push({width,status:'passed'});await page.close();
              }
              fs.writeFileSync('validation-output/browser-report.json',JSON.stringify({viewports:report,external_requests:'blocked',form_submissions:'not performed'},null,2));
            }finally{await browser.close();await new Promise(r=>server.close(r));}
          })().catch(e=>{console.error(e);server.close();process.exitCode=1;});
          NODE
      - name: Conserver les rapports de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-mecenia-${{ github.sha }}
          path: validation-output/
          if-no-files-found: warn
          retention-days: 7
