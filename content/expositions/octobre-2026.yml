title: "Maecenas : réinventer la cour du Sphinx"
period: "2026-10"
draft: false
seo_description: "Six œuvres antiques, trois étapes et des cartels documentés : une exposition numérique indépendante proposée par Mecenia."
hero_subtitle: "Un territoire, des héritages, le temps de la transmission : six œuvres antiques pour regarder autrement un lieu en devenir."
eyebrow: "L’exposition Mecenia · Octobre 2026"
intro_title: "Une cour, six œuvres, trois regards"
intro_paragraphs:
  - "Cette exposition numérique relie le fleuve et le souverain, les héritages grecs et le temps de la transmission. Elle prend pour point de départ la restauration de la cour du Sphinx : le Louvre annonce un parcours romain repensé, une nouvelle verrière, la restauration des façades et du sol, ainsi qu’une médiation renouvelée."
  - "Notre sélection réunit des œuvres de dates, de provenances et de fonctions différentes. Une personnification donne un visage à un territoire ; un portrait rend le pouvoir présent ; les reliefs et les mosaïques inscrivent des récits dans l’architecture et les espaces de vie."
project_url: "https://tousmecenes.louvre.fr/fr/projet/"
project_link_label: "Découvrir le projet officiel"
note: "Proposition éditoriale indépendante de Mecenia, sans partenariat avec le Louvre. Le Tibre, la frise d’Artémis et la Mosaïque des Saisons figurent dans le projet du musée. Tibère, Diane de Versailles et la Vénus d’Arles sont des contrepoints choisis par Mecenia. « Maecenas » est notre proposition, non un nom adopté par le Louvre."
article_url: "/blog/cour-du-sphinx-louvre-tous-mecenes/"
acts:
  - n: 1
    title: "Un territoire, des visages"
    text: "Commencer par ce qui donne une forme à Rome : son fleuve et la présence de l’empereur."
  - n: 2
    title: "Des héritages en circulation"
    text: "Regarder comment les récits et les figures grecques résonnent dans des créations de l’époque romaine."
  - n: 3
    title: "Habiter le temps"
    text: "Passer des figures divines à un espace de vie, puis aux gestes de conservation qui le rendent lisible aujourd’hui."
works:
  - id: "tibre"
    act: 1
    title: "Le Tibre"
    date: "Époque romaine"
    medium: "Sculpture en marbre"
    origin: "Rome"
    status: "Ensemble annoncé par le Louvre"
    contrepoint: false
    commons_file: "Sculpture of Tiber river (Louvre).jpg"
    alt: "Le Tibre personnifié, avec la louve et les jumeaux"
    credit: "Tangopaso"
    license_name: "Domaine public"
    license_url: ""
    image_source_url: "https://commons.wikimedia.org/wiki/File:Sculpture_of_Tiber_river_(Louvre).jpg"
    source: "https://tousmecenes.louvre.fr/fr/projet/"
    notice: "Le fleuve prend les traits d’un homme allongé. La louve allaitant Romulus et Rémus relie le paysage au récit fondateur de Rome. Le Louvre annonce le retour de cette statue dans la cour."
    complement: "La rame et la corne d’abondance associent le fleuve à la navigation et aux richesses de Rome. Selon le Louvre, cette statue en marbre du mont Pentélique ornait une fontaine du temple d’Isis à Rome, en pendant d’une statue du Nil ; découverte en 1512, elle rejoint le Louvre en 1797."
    reading: "Nous ouvrons le parcours par un territoire devenu image : Rome se raconte à travers un fleuve, une légende et une sculpture. Le financement d’une restauration permet de rendre à nouveau lisibles ces relations entre les œuvres et leurs publics."
    transition: "Du territoire à ceux qui gouvernent : la deuxième œuvre interroge la fabrication d’une présence impériale."
  - id: "tibere"
    act: 1
    title: "Portrait de Tibère"
    date: "Après 32 apr. J.-C., selon la notice du Louvre"
    medium: "Statue en marbre · Ma 1248"
    origin: "Découverte à Capri ; création à Rome proposée par la notice"
    status: "Contrepoint proposé par Mecenia"
    contrepoint: true
    commons_file: "Tiberius Capri Louvre Ma1248.jpg"
    alt: "Statue de l’empereur Tibère conservée au Louvre"
    credit: "Marie-Lan Nguyen"
    license_name: "Domaine public"
    license_url: ""
    image_source_url: "https://commons.wikimedia.org/wiki/File:Tiberius_Capri_Louvre_Ma1248.jpg"
    source: "https://collections.louvre.fr/en/ark:/53355/cl010275400"
    notice: "Cette statue représente Tibère. La notice du Louvre situe sa réalisation après 32 apr. J.-C. et indique une découverte à Capri. Sa présence dans notre parcours est un choix éditorial, pas une annonce de déplacement dans la cour."
    complement: ""
    reading: "Après le fleuve qui personnifie un territoire, voici le portrait qui rend un souverain reconnaissable. Ce rapprochement permet de regarder les images antiques comme des objets destinés à communiquer, et pas seulement comme des formes idéales."
    transition: "Les images du monde romain héritent aussi de récits et de formes venus du monde grec."
  - id: "frise"
    act: 2
    title: "Frise du temple d’Artémis"
    date: "IIe siècle av. J.-C. · art grec hellénistique"
    medium: "Reliefs sculptés en marbre"
    origin: "Magnésie du Méandre, actuelle Turquie"
    status: "Ensemble annoncé par le Louvre"
    contrepoint: false
    commons_file: "Frieze Magnesia ad Meandrum 32 Louvre.jpg"
    alt: "Fragment de la frise du temple d’Artémis à Magnésie du Méandre"
    credit: ""
    license_name: ""
    license_url: ""
    image_source_url: "https://commons.wikimedia.org/wiki/File:Frieze_Magnesia_ad_Meandrum_32_Louvre.jpg"
    source: "https://tousmecenes.louvre.fr/fr/projet/"
    notice: "La frise du temple d’Artémis Leucophryène représente une amazonomachie, le combat des Amazones avec des héros. Le projet du Louvre la présente parmi les ensembles du parcours renouvelé. Il s’agit d’un héritage grec, antérieur à l’époque impériale romaine."
    complement: "Le Louvre conserve quarante et une plaques, soit 42 % de cette frise du IIe siècle avant notre ère. L’amazonomachie met en scène des Amazones affrontant des héros, dont Héraclès. La photographie montre un détail de l’ensemble, non la totalité du décor."
    reading: "La sculpture raconte une histoire par séquences : les gestes se répondent, les figures débordent les limites d’une seule plaque. Cette étape introduit les circulations de formes et de récits que notre parcours romain ne doit pas effacer."
    transition: "D’un récit architectural à une figure isolée : Artémis devient Diane dans le monde romain."
  - id: "diane"
    act: 2
    title: "Diane de Versailles"
    date: "125–150 apr. J.-C. ? · datation proposée par le Louvre"
    medium: "Sculpture en marbre · Ma 589"
    origin: "Italie"
    status: "Contrepoint proposé par Mecenia"
    contrepoint: true
    commons_file: "Artemisa Diane Versailles.jpg"
    alt: "Diane avec une biche, sculpture antique conservée au Louvre"
    credit: "Eric Gaba / Sting"
    license_name: "CC BY-SA 2.5"
    license_url: "https://creativecommons.org/licenses/by-sa/2.5/"
    image_source_url: "https://commons.wikimedia.org/wiki/File:Artemisa_Diane_Versailles.jpg"
    source: "https://collections.louvre.fr/ark:/53355/cl010278930"
    notice: "La figure d’Artémis accompagnée d’une biche est connue sous le nom de Diane de Versailles. La notice du Louvre propose une réalisation entre 125 et 150 apr. J.-C., avec une incertitude signalée. Elle n’est pas annoncée ici comme future occupante de la cour."
    complement: ""
    reading: "Le rapprochement avec la frise ne repose pas sur une identité de date ou de fonction. Il permet de suivre une figure divine entre contextes grecs et romains, puis entre lieux de conservation modernes. Transmettre, c’est aussi expliquer ces déplacements."
    transition: "Les figures divines passent des monuments aux espaces de représentation et de vie."
  - id: "venus"
    act: 3
    title: "Vénus d’Arles"
    date: "Fin du Ier siècle av. J.-C."
    medium: "Sculpture en marbre · Ma 439"
    origin: "Découverte au théâtre antique d’Arles"
    status: "Contrepoint proposé par Mecenia"
    contrepoint: true
    commons_file: "Venus of Arles Louvre Ma439 n01.jpg"
    alt: "La Vénus d’Arles, sculpture des collections du Louvre"
    credit: "Marie-Lan Nguyen"
    license_name: "CC BY 2.5"
    license_url: "https://creativecommons.org/licenses/by/2.5/"
    image_source_url: "https://commons.wikimedia.org/wiki/File:Venus_of_Arles_Louvre_Ma439_n01.jpg"
    source: "https://collections.louvre.fr/ark:/53355/cl010277986"
    notice: "Cette statue d’Aphrodite, dite Vénus d’Arles, provient du théâtre antique de la ville. Cette présentation ne préjuge ni de sa localisation actuelle, ni d’un déplacement futur dans la cour du Sphinx."
    complement: ""
    reading: "Après les récits collectifs, le parcours revient à une figure que chacun reconnaît différemment. Une œuvre conservée n’arrive pas jusqu’à nous seule : elle est accompagnée de choix de restauration, d’interprétations et de conditions de présentation."
    transition: "La dernière étape quitte la figure isolée pour regarder un espace habité et le rythme des saisons."
  - id: "saisons"
    act: 3
    title: "Mosaïque des Saisons"
    date: "IVe siècle apr. J.-C."
    medium: "Pavement en mosaïque · ensemble Ma 3444"
    origin: "Daphné, près d’Antioche, actuelle Turquie"
    status: "Ensemble annoncé par le Louvre"
    contrepoint: false
    commons_file: "Seasons mosaics, Ma 3444 (688).jpg"
    alt: "Mosaïque des Saisons provenant de Daphné, conservée au Louvre"
    credit: ""
    license_name: ""
    license_url: ""
    image_source_url: "https://commons.wikimedia.org/wiki/File:Seasons_mosaics,_Ma_3444_(688).jpg"
    source: "https://collections.louvre.fr/ark:/53355/cl010250192"
    notice: "Le pavement associait les figures des saisons à des scènes de chasse et à des végétaux autour d’un bassin central. Le Louvre le présente parmi les œuvres du parcours renouvelé. Sa restauration de 2018–2019 a fait l’objet d’une étude de Cécile Giroire."
    complement: "Découvert en 1935, ce pavement de villa romaine associe des allégories féminines ailées des saisons à des scènes de chasse et à des végétaux autour d’un bassin. Le Louvre décrit des tesselles de marbre, de pierre, de verre et de verre doré, dont la restauration de 2018–2019 a révélé la richesse. Cette photographie d’un état de présentation antérieur ne préfigure pas le nouvel accrochage."
    reading: "Nous terminons par le temps vécu : les saisons, les matériaux et les gestes qui construisent un cadre de vie. La mosaïque donne au mot « transmission » une dimension concrète, celle d’une œuvre que l’on étudie, entretient et rend accessible."
    transition: "Retour au présent : qu’attendons-nous d’un lieu public restauré, et comment choisissons-nous de soutenir sa transmission ?"
method_title: "Conserver, interpréter, transmettre"
method_text: "Ce parcours n’est ni un plan d’accrochage officiel ni une reconstitution antique. Les textes « Le regard de Mecenia » sont des interprétations ; les datations et descriptions s’appuient sur les notices citées. Le projet du Louvre relie les œuvres au bâtiment qui les accueille : étanchéité, ventilation, lumière et médiation font partie des conditions de leur transmission. Soutenir ce chantier ne signifie pas devenir propriétaire des œuvres."
images_text: "Les photographies proviennent de Wikimedia Commons : l’auteur, la licence et le fichier d’origine figurent sous chaque image. Les reproductions sont hébergées avec le site, affichées sans recadrage et agrandissables par un clic. Une photographie partielle d’un ensemble n’en restitue pas la totalité."
update_note: "Parcours d’octobre 2026 · Mise à jour éditoriale : 3 octobre 2026. Les annonces du musée peuvent évoluer ; aucun emplacement futur ni calendrier de déplacement n’est fixé ici."
cta_title: "La culture se transmet ensemble"
cta_text: "Cette exposition prolonge le dialogue entre les œuvres, leurs publics et ceux qui soutiennent leur conservation."
