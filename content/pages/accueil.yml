    lien_url: "/a-propos/#mission"
  - type: texte
    id: rca
    fond: beige
    eyebrow: "Notre finalité"
    titre: "Les Rencontres de la Culture et des Affaires"
    texte: |
      Au-delà de nos premiers formats (webinaires, colloques, publications), Mecenia porte une ambition de long terme : donner naissance à un rendez-vous annuel de référence, les **Rencontres de la Culture et des Affaires (RCA)**.

      Il ne s’agit pas encore d’un événement daté ni localisé, mais d’une finalité que nous construisons pas à pas, à mesure que notre réseau et nos partenariats se structurent.
    image: "/assets/img/logo-rca.png"
    image_alt: "Logo des Rencontres de la Culture et des Affaires (RCA)"
    image_cote: gauche
    image_style: logo
    boutons:
      - { label: "Tout savoir sur les RCA", url: "/evenements/#rca", style: "lien" }
  - type: cartes
    fond: sombre
    eyebrow: "Nos valeurs"
    titre: "Les principes qui guident notre action"
    intro: "Six engagements, issus de nos statuts et de notre règlement intérieur, pour un dialogue sans confusion des rôles."
    colonnes: 3
    style: "numerote"
    cartes:
      - { titre: "Passerelle & dialogue", texte: "Une composition mixte qui organise la rencontre sans confusion des rôles." }
      - { titre: "Exigence intellectuelle", texte: "Un conseil scientifique, des propositions pragmatiques, le refus du misérabilisme budgétaire." }
      - { titre: "Intégrité & indépendance", texte: "Tolérance zéro sur les conflits d’intérêts, gestion strictement désintéressée." }
      - { titre: "Enracinement patrimonial", texte: "Une identité classique, un ancrage à Paris, une filiation avec les grands cercles de mécénat." }
      - { titre: "Pragmatisme économique", texte: "Recentrer le débat sur la compétitivité et le soft power." }
      - { titre: "Continuité & ambition longue", texte: "Une trajectoire pensée dès l’origine : association, entreprise, puis fondation." }
    lien_label: "Explorer chaque valeur"
    lien_url: "/a-propos/#valeurs"
  - type: faq
    fond: blanc
    eyebrow: "Nos premiers projets"
    titre: "Ce que nous lançons dès à présent"
    intro: "Des formats concrets et accessibles pour amorcer le dialogue entre culture et économie. Cliquez sur le « + » pour afficher le détail."
    questions:
      - etiquette: "Blog"
        question: "Le blog de Mecenia"
        resume: "Analyses, comptes rendus et réflexions sur la culture comme richesse économique."
        reponse: "Notre blog publie des analyses, des comptes rendus d’événements et des réflexions sur la culture comme richesse économique et pouvoir d’influence. Les articles se classent par thématique (cinéma, peinture, sculpture…) et par type (actualité, événement, exposition…). [Lire le blog](/blog/)"
      - etiquette: "À venir"
        question: "La lettre mensuelle de Mecenia"
        resume: "Un rendez-vous pour découvrir nos actualités et notre sélection culturelle."
        reponse: "À l’étude : une newsletter mensuelle réunissant les nouveautés de Mecenia, les articles publiés dans le mois, une sélection d’expositions à découvrir et nos prochains événements. Son lancement et son calendrier seront annoncés ultérieurement. L’inscription sera facultative."
      - etiquette: "Webinaire pilote"
        question: "Premier webinaire Mecenia"
        resume: "Tester notre format d’échange entre acteurs économiques et culturels."
        reponse: "Objectif : réunir au moins 30 participants dans les trois premiers mois, pour éprouver le format avant le grand événement et rassembler une première communauté autour de nos travaux."
      - etiquette: "Colloques thématiques"
        question: "Cycle de colloques"
        resume: "Financement, valorisation et protection de la création et du patrimoine."
        reponse: "Les statuts prévoient des colloques thématiques, à raison d’un par trimestre à terme, préparés avec le conseil scientifique."
      - etiquette: "Publication"
        question: "Première note de position"
        resume: "Une publication courte sur le financement de la culture en France."
        reponse: "Une note de 2 à 4 pages, destinée à poser les bases de notre plaidoyer et à être diffusée à l’occasion de la première RCA."
    lien_label: "Voir tous nos projets"
    lien_url: "/evenements/"
  - type: fondateurs
