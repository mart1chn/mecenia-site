      - src: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Flotte_normande.jpg/960px-Flotte_normande.jpg"
        alt: "Flotte normande de la Tapisserie de Bayeux"
        legende: "*Tapisserie de Bayeux*, la flotte normande, broderie de laine sur lin, XIe siècle. [Domaine public · Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Flotte_normande.jpg)"
