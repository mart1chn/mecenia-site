  - type: blog_recents
    fond: beige
    eyebrow: "Le blog"
    titre: "Les derniers articles"
    intro: "Analyses, comptes rendus et réflexions sur la culture comme richesse économique et pouvoir d’influence."
    nombre: 3
    lien_label: "Tous les articles"
  - type: cartes
    fond: blanc
    eyebrow: "Notre mission"
    titre: "Implanter les mondes culturels dans la sphère économique"
    intro: "Auprès de grands acteurs traditionnellement éloignés de cet univers : entreprises, organisations professionnelles, institutions publiques."
    colonnes: 3
    cartes:
      - titre: "Favoriser le dialogue"
        texte: "Créer les conditions de la rencontre entre acteurs économiques (entreprises, fondations, philanthropes) et acteurs de la culture (institutions, musées, société civile)."
      - titre: "Faire émerger une vision"
        texte: "Diffuser une vision de la culture comme opportunité économique, facteur de compétitivité et de puissance pour la France."
      - titre: "Porter des propositions"
        texte: "Formuler des propositions pragmatiques, notamment dans le champ des affaires publiques, sur le financement et la valorisation de la culture."
