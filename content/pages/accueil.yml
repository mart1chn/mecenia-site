  - type: faq
    fond: blanc
    eyebrow: "Questions fréquentes"
    titre: "Mecenia en quelques réponses"
    intro: "Cliquez sur le « + » pour découvrir la réponse."
    questions:
      - question: "Qu’est-ce que Mecenia ?"
        reponse: "Mecenia est une association loi 1901 basée à Paris qui fait dialoguer les mondes économique et culturel. Elle veut faire émerger une vision de la culture comme richesse nationale, facteur de compétitivité et de rayonnement pour la France, notamment par des propositions pragmatiques dans le champ des affaires publiques."
      - question: "Qui a fondé Mecenia ?"
        reponse: "Mecenia a été fondée par Pauline Bion, élève à l’École du Louvre (histoire de l’art) et Présidente, et Martin Chanteranne, formé en droit à Paris Panthéon-Assas et à Genève, aujourd’hui au CEIPI en propriété intellectuelle, Vice-Président et Trésorier. Tous deux sont engagés à la Confédération Nationale des Junior-Entreprises (CNJE), au pôle Développement pour 2026-2027."
      - question: "Que signifie RCA ?"
        reponse: "RCA signifie Rencontres de la Culture et des Affaires. C’est l’événement annuel de référence que Mecenia ambitionne d’organiser pour réunir décideurs économiques et acteurs culturels autour de propositions concrètes. Il n’est pas encore daté ni localisé."
      - question: "Comment rejoindre Mecenia ?"
        reponse: "Trois possibilités : devenir membre actif (personne physique, par cooptation du conseil d’administration puis ratification en assemblée générale), devenir membre partenaire (entreprise, organisation professionnelle, musée ou institution) ou simplement suivre nos travaux. Aucune cotisation n’est exigée à ce jour."
  - type: cta
    fond: sombre
    titre: "Envie de construire ce projet avec nous ?"
    texte: "Mecenia se construit dès aujourd’hui, avec ses premiers membres et partenaires. Rejoignez-nous ou écrivez-nous pour en discuter, sans engagement."
    boutons:
      - { label: "Adhérer à Mecenia", url: "/adherer/", style: "principal" }
      - { label: "Nous contacter", url: "/contact/", style: "secondaire" }
