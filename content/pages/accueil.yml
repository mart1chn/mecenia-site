chemin: "/"
titre_seo: "Mecenia — Rapprocher la culture et les affaires | Association, Paris"
description: "Mecenia est une association loi 1901 qui fait dialoguer les mondes économique et culturel pour faire de la culture une richesse économique et un pouvoir d’influence pour la France. Rencontres de la Culture et des Affaires (RCA)."
blocs:
  - type: hero
    variante: accueil
    eyebrow: "Association loi 1901"
    titre: "Faire de la culture une richesse économique et un pouvoir d’influence pour la France"
    sous_titre: "Mecenia fait dialoguer les mondes économique et culturel pour faire émerger une vision de la culture comme opportunité, et non comme une charge."
    boutons:
      - { label: "Nous rejoindre", url: "/adherer/", style: "principal" }
      - { label: "Découvrir notre histoire", url: "/a-propos/#histoire", style: "secondaire" }
  - type: chiffres
    fond: blanc
    eyebrow: "Le constat"
    titre: "La culture pèse plus qu’on ne le dit, et compte moins qu’elle ne le devrait"
    intro: "En France, la culture demeure trop souvent perçue comme une charge budgétaire plutôt que comme un facteur de compétitivité économique, de rayonnement international et de cohésion sociale."
  - type: citation
    fond: sombre
    texte: "La culture, c’est ce qui répond à l’homme quand il se demande ce qu’il fait sur la terre."
    auteur: "André Malraux"
    source: "Maison de la culture d’Amiens, 1966"
    suite: "Ciment de la paix sociale et de l’unité d’un peuple, la culture mérite de revenir au centre de l’attention des pouvoirs publics et des acteurs économiques. C’est la raison d’être de Mecenia."
    bouton: { label: "Lire notre histoire", url: "/a-propos/#histoire" }
  - type: triptyque
    fond: blanc
    eyebrow: "Un patrimoine universel"
    titre: "La culture, un seul et même horizon"
    texte: "Un prince de Sumer, bâtisseur de temples, sculpté en prière il y a plus de 4 000 ans ; une flotte de conquête brodée sur du lin au XIe siècle ; un roi qui inspecte le chantier de la tour de Babel, peint par Bruegel en 1563 : une sculpture, une tapisserie et une peinture, séparées par des siècles, racontent pourtant la même histoire, celle des commanditaires et des artisans qui bâtissent ensemble. Les formes d’art se répondent et se nourrissent les unes les autres : c’est cet ensemble, dans toute sa diversité, que Mecenia veut financer, valoriser et protéger."
    images:
