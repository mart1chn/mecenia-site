backend:
  name: github
  repo: mart1chn/mecenia-site
  branch: main

app_title: Mecenia · Espace d’administration
logo:
  src: /assets/img/mecenia-icon.png
  show_in_header: true

site_url: https://www.mecenia.org
display_url: https://www.mecenia.org

media_folder: /assets/img/blog
public_folder: /assets/img/blog

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 26214400
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
        svg:
          optimize: true

output:
  omit_empty_optional_fields: true
  yaml:
    quote: double

collections:
  - name: blog
    label: Articles du blog
    label_singular: Article
    icon: article
    folder: content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Résumé", name: "description", widget: "text", hint: "1 à 2 phrases, affichées sur la liste des articles, sur l’accueil et dans Google (moins de 160 caractères)." }
      - { label: "Image de couverture", name: "image", widget: "image", required: false, hint: "Format paysage conseillé (16/9). Facultatif. Les images sont automatiquement allégées (WebP)." }
      - { label: "Thématiques", name: "themes", widget: "relation", collection: "reglages", file: "categories", multiple: true, required: false, search_fields: ["themes.*.name"], display_fields: ["themes.*.name"], value_field: "themes.*.name", hint: "Cinéma, peinture, sculpture… Plusieurs choix possibles. La liste se gère dans « Réglages du blog »." }
      - { label: "Type d’article", name: "kind", widget: "relation", collection: "reglages", file: "categories", required: false, search_fields: ["types.*.name"], display_fields: ["types.*.name"], value_field: "types.*.name", hint: "Actualité, événement, exposition, formation… Un seul choix. La liste se gère dans « Réglages du blog »." }
      - { label: "Brouillon (non publié)", name: "draft", widget: "boolean", default: false, hint: "Cochez pour enregistrer sans publier sur le site." }
      - { label: "Texte principal", name: "body", widget: "markdown", required: false, hint: "Facultatif si vous composez l’article avec les blocs de mise en page ci-dessous. Ce texte s’affiche en premier." }
      - label: "Mise en page (blocs)"
        name: "blocks"
        widget: "list"
        required: false
        label_singular: "bloc"
        typeKey: "type"
        hint: "Composez l’article bloc par bloc, comme dans un magazine : texte, image sur le côté, image pleine largeur, galerie, citation, encadré. Les blocs se réordonnent par glisser-déposer."
        types:
          - label: "Texte"
            name: "texte"
            widget: "object"
            fields:
              - { label: "Texte", name: "texte", widget: "markdown" }
          - label: "Texte + image sur le côté"
            name: "texte_image"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description de l’image (accessibilité)", name: "alt", widget: "string", required: false }
              - { label: "Légende", name: "legende", widget: "string", required: false }
              - { label: "Côté de l’image", name: "cote", widget: "select", default: "droite", options: [{ label: "À droite du texte", value: "droite" }, { label: "À gauche du texte", value: "gauche" }] }
              - { label: "Largeur de l’image", name: "largeur", widget: "select", default: "moyenne", options: [{ label: "Étroite (30 %)", value: "etroite" }, { label: "Moyenne (40 %)", value: "moyenne" }, { label: "Large (50 %)", value: "large" }] }
              - { label: "Cadrage", name: "cadrage", widget: "select", default: "portrait", options: [{ label: "Portrait vertical (3:4)", value: "portrait" }, { label: "Format d’origine", value: "original" }] }
              - { label: "Texte", name: "texte", widget: "markdown" }
          - label: "Image pleine largeur"
            name: "image"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description de l’image (accessibilité)", name: "alt", widget: "string", required: false }
              - { label: "Légende", name: "legende", widget: "string", required: false }
              - { label: "Format", name: "format", widget: "select", default: "original", options: [{ label: "Format d’origine", value: "original" }, { label: "Paysage (16:9)", value: "paysage" }, { label: "Panoramique (21:9)", value: "panoramique" }] }
          - label: "Galerie (2 ou 3 images)"
            name: "galerie"
            widget: "object"
            fields:
              - { label: "Cadrage", name: "cadrage", widget: "select", default: "portrait", options: [{ label: "Portrait vertical (3:4)", value: "portrait" }, { label: "Paysage (16:9)", value: "paysage" }, { label: "Carré", value: "carre" }, { label: "Format d’origine", value: "original" }] }
              - label: "Images"
                name: "images"
                widget: "list"
                min: 2
                max: 3
                label_singular: "image"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Description de l’image (accessibilité)", name: "alt", widget: "string", required: false }
                  - { label: "Légende", name: "legende", widget: "string", required: false }
          - label: "Citation"
            name: "citation"
            widget: "object"
            fields:
              - { label: "Citation", name: "texte", widget: "text" }
              - { label: "Auteur", name: "auteur", widget: "string", required: false }
          - label: "Encadré"
            name: "encadre"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string", required: false }
              - { label: "Texte", name: "texte", widget: "markdown" }

  - name: messages
    label: Messages reçus
    label_singular: Message
    icon: mail
    folder: content/messages
    create: false
    delete: true
    extension: md
    format: frontmatter
    summary: "{{status}} · {{title}} · {{date}}"
    sortable_fields: ["date", "status", "title"]
    view_filters:
      - { label: "Nouveaux", field: "status", pattern: "nouveau" }
      - { label: "Lus", field: "status", pattern: "lu" }
      - { label: "Traités", field: "status", pattern: "traité" }
    fields:
      - { label: "Statut", name: "status", widget: "select", options: ["nouveau", "lu", "traité"], default: "nouveau" }
      - { label: "Objet", name: "title", widget: "string" }
      - { label: "Formulaire", name: "form", widget: "string", required: false }
      - { label: "Reçu le", name: "date", widget: "string" }
      - { label: "Nom", name: "name", widget: "string", required: false }
      - { label: "E-mail", name: "email", widget: "string", required: false }
      - { label: "Téléphone", name: "phone", widget: "string", required: false }
      - { label: "Organisation", name: "organisation", widget: "string", required: false }
      - { label: "Fonction", name: "role", widget: "string", required: false }
      - { label: "Type ou sujet", name: "type", widget: "string", required: false }
      - { label: "Message", name: "body", widget: "text", required: false }

  - name: reglages
    label: Réglages du blog
    icon: tune
    files:
      - name: categories
        label: Thématiques et types d’articles
        file: content/settings/categories.yml
        format: yaml
        fields:
          - label: "Thématiques"
            name: "themes"
            widget: "list"
            label_singular: "thématique"
            hint: "Cinéma, peinture, sculpture, littérature, mode… Ajoutez, renommez ou supprimez. Renommer une thématique ne modifie pas les articles déjà enregistrés."
            fields:
              - { label: "Nom", name: "name", widget: "string" }
          - label: "Types d’article"
            name: "types"
            widget: "list"
            label_singular: "type"
            hint: "Actualité, événement, exposition, formation… Renommer un type ne modifie pas les articles déjà enregistrés."
            fields:
              - { label: "Nom", name: "name", widget: "string" }
