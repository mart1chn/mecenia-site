backend:
  name: github
  repo: mart1chn/mecenia-site
  branch: main

app_title: Mecenia · Espace d’administration
logo:
  src: /assets/img/mecenia-icon.png
  show_in_header: true

site_url: https://www.mecenia.org
display_url: https://www.mecenia.org

media_folder: /assets/img/blog
public_folder: /assets/img/blog

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 26214400
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
        svg:
          optimize: true

output:
  omit_empty_optional_fields: true
  yaml:
    quote: double

collections:
  - name: blog
    label: Articles
    label_singular: Article
    description: "Rédigez, mettez en page et publiez les articles du blog. Un article en brouillon reste invisible sur le site."
    icon: article
    folder: content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titre de l’article", name: "title", widget: "string", hint: "Le grand titre affiché en haut de l’article." }
      - { label: "Texte principal", name: "body", widget: "markdown", required: false, hint: "Écrivez ici comme dans un traitement de texte. Pour placer une image à côté du texte, une galerie ou une citation, utilisez la « Mise en page avancée » plus bas." }
      - label: "Mise en page avancée (facultatif)"
        name: "blocks"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "bloc"
        typeKey: "type"
        hint: "Ajoutez des blocs à la suite du texte principal, comme dans un magazine. Glissez-déposez les blocs pour les réordonner."
        types:
          - label: "Paragraphe"
            name: "texte"
            widget: "object"
            summary: "Paragraphe : {{fields.texte}}"
            fields:
              - { label: "Texte", name: "texte", widget: "markdown" }
          - label: "Image à côté du texte"
            name: "texte_image"
            widget: "object"
            summary: "Image à côté du texte : {{fields.legende}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Texte", name: "texte", widget: "markdown" }
              - { label: "Côté de l’image", name: "cote", widget: "select", default: "droite", options: [{ label: "À droite du texte", value: "droite" }, { label: "À gauche du texte", value: "gauche" }] }
              - { label: "Taille de l’image", name: "largeur", widget: "select", default: "moyenne", options: [{ label: "Petite", value: "etroite" }, { label: "Moyenne", value: "moyenne" }, { label: "Grande", value: "large" }] }
              - { label: "Forme de l’image", name: "cadrage", widget: "select", default: "portrait", options: [{ label: "Portrait (vertical)", value: "portrait" }, { label: "Telle quelle", value: "original" }] }
              - { label: "Légende", name: "legende", widget: "string", required: false, hint: "Petite phrase sous l’image (facultatif)." }
              - { label: "Texte alternatif", name: "alt", widget: "string", required: false, hint: "Décrit l’image pour les personnes malvoyantes et Google (facultatif)." }
          - label: "Image seule"
            name: "image"
            widget: "object"
            summary: "Image seule : {{fields.legende}}"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Forme", name: "format", widget: "select", default: "original", options: [{ label: "Telle quelle", value: "original" }, { label: "Paysage", value: "paysage" }, { label: "Panoramique (très large)", value: "panoramique" }] }
              - { label: "Légende", name: "legende", widget: "string", required: false }
              - { label: "Texte alternatif", name: "alt", widget: "string", required: false, hint: "Décrit l’image pour les personnes malvoyantes et Google (facultatif)." }
          - label: "Galerie (2 ou 3 images)"
            name: "galerie"
            widget: "object"
            summary: "Galerie de photos"
            fields:
              - label: "Images"
                name: "images"
                widget: "list"
                min: 2
                max: 3
                label_singular: "image"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Légende", name: "legende", widget: "string", required: false }
                  - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
              - { label: "Forme des images", name: "cadrage", widget: "select", default: "portrait", options: [{ label: "Portrait (vertical)", value: "portrait" }, { label: "Paysage", value: "paysage" }, { label: "Carré", value: "carre" }, { label: "Telles quelles", value: "original" }] }
          - label: "Citation"
            name: "citation"
            widget: "object"
            summary: "Citation : {{fields.texte}}"
            fields:
              - { label: "Citation", name: "texte", widget: "text" }
              - { label: "Auteur", name: "auteur", widget: "string", required: false }
          - label: "Encadré"
            name: "encadre"
            widget: "object"
            summary: "Encadré : {{fields.titre}}"
            fields:
              - { label: "Titre", name: "titre", widget: "string", required: false }
              - { label: "Texte", name: "texte", widget: "markdown" }
      - { label: "Extrait", name: "description", widget: "text", hint: "2 à 3 lignes qui donnent envie de lire. Affiché sur la liste des articles, sur l’accueil et dans Google." }
      - { label: "Image mise en avant", name: "image", widget: "image", required: false, hint: "L’image de couverture, de préférence en format paysage. Elle est automatiquement allégée." }
      - { label: "Thématiques", name: "themes", widget: "relation", collection: "reglages", file: "categories", multiple: true, required: false, search_fields: ["themes.*.name"], display_fields: ["themes.*.name"], value_field: "themes.*.name", hint: "Cinéma, peinture, sculpture… Plusieurs choix possibles. La liste se modifie dans « Catégories du blog »." }
      - { label: "Type d’article", name: "kind", widget: "relation", collection: "reglages", file: "categories", required: false, search_fields: ["types.*.name"], display_fields: ["types.*.name"], value_field: "types.*.name", hint: "Actualité, événement, exposition, formation… Un seul choix. La liste se modifie dans « Catégories du blog »." }
      - { label: "Date de publication", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: true, hint: "Coché : l’article est enregistré mais reste invisible sur le site. Décochez pour le publier." }

  - name: messages
    label: Messages reçus
    label_singular: Message
    description: "Les messages envoyés depuis les formulaires de contact et d’adhésion."
    icon: mail
    folder: content/messages
    create: false
    delete: true
    extension: md
    format: frontmatter
    summary: "{{status}} · {{title}} · {{date}}"
    sortable_fields: ["date", "status", "title"]
    view_filters:
      - { label: "Nouveaux", field: "status", pattern: "nouveau" }
      - { label: "Lus", field: "status", pattern: "lu" }
      - { label: "Traités", field: "status", pattern: "traité" }
    fields:
      - { label: "Statut", name: "status", widget: "select", options: ["nouveau", "lu", "traité"], default: "nouveau" }
      - { label: "Objet", name: "title", widget: "string" }
      - { label: "Formulaire", name: "form", widget: "string", required: false }
      - { label: "Reçu le", name: "date", widget: "string" }
      - { label: "Nom", name: "name", widget: "string", required: false }
      - { label: "E-mail", name: "email", widget: "string", required: false }
      - { label: "Téléphone", name: "phone", widget: "string", required: false }
      - { label: "Organisation", name: "organisation", widget: "string", required: false }
      - { label: "Fonction", name: "role", widget: "string", required: false }
      - { label: "Type ou sujet", name: "type", widget: "string", required: false }
      - { label: "Message", name: "body", widget: "text", required: false }
      - { label: "Newsletter", name: "newsletter", widget: "string", required: false }
      - { label: "Consentement newsletter (date)", name: "newsletter_consent_at", widget: "string", required: false }
      - { label: "Consentement newsletter (version)", name: "newsletter_consent_version", widget: "string", required: false }

  - name: reglages
    label: Catégories du blog
    description: "Les thématiques et les types d’articles proposés lors de la rédaction, et utilisés comme filtres sur le blog."
    icon: tune
    files:
      - name: categories
        label: Thématiques et types d’articles
        file: content/settings/categories.yml
        format: yaml
        fields:
          - label: "Thématiques"
            name: "themes"
            widget: "list"
            label_singular: "thématique"
            hint: "Cinéma, peinture, sculpture, littérature, mode… Ajoutez, renommez ou supprimez. Renommer une thématique ne modifie pas les articles déjà enregistrés."
            fields:
              - { label: "Nom", name: "name", widget: "string" }
          - label: "Types d’article"
            name: "types"
            widget: "list"
            label_singular: "type"
            hint: "Actualité, événement, exposition, formation… Renommer un type ne modifie pas les articles déjà enregistrés."
            fields:
              - { label: "Nom", name: "name", widget: "string" }
